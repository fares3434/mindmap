<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collaborative mind map</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f9;--fg:#1f2430;--card:#fff;--line:#b9bdcc;--mut:#646a7c;--bd:#d9dce6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171e;--fg:#eceef5;--card:#222633;--line:#5a6078;--mut:#a0a6ba;--bd:#383d50}}
:root[data-theme=dark]{--bg:#15171e;--fg:#eceef5;--card:#222633;--line:#5a6078;--mut:#a0a6ba;--bd:#383d50}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 12px}
button:hover{border-color:#7a5fd0}
button.p{background:#5b3fa8;color:#fff;border-color:#5b3fa8}
input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--card)}
header h1{font-size:16px;margin:0;flex:1;min-width:140px}
header input{width:140px}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.home{max-width:560px;margin:24px auto;padding:0 16px;display:grid;gap:14px;overflow:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:grid;gap:10px}
.card h2{margin:0;font-size:17px}
#st{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;min-height:0}
#w{position:absolute;left:0;top:0;transform-origin:0 0}
.n{position:absolute;transform:translate(-50%,-50%);border:1.5px solid var(--b);background:var(--c);color:#1f2430;border-radius:26px;padding:10px 16px;text-align:center;transition:left .25s,top .25s,opacity .2s;box-shadow:0 1px 3px #0002}
.n.i{border-radius:22px;padding:8px 12px;cursor:move;font-size:14px;text-align:left}
.n.i .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n.i .m{font-size:11px;color:#4a5064;margin-top:2px}
.n.i img{width:100%;height:80px;object-fit:cover;border-radius:12px;margin-top:6px;cursor:zoom-in}
.n.i .a{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.n .a button,.n.qn button{background:#fff8;border:0;padding:2px 7px;border-radius:8px;font-size:12px;color:#1f2430}
.n.qn{font-weight:600;width:250px;font-size:15px}
.n.ct{width:230px;font-size:17px;font-weight:700;background:#ece6fb;border:2.5px solid #5b3fa8;border-radius:40px}
.dim{opacity:.2}.new{animation:pop .6s;outline:3px solid #f7b500}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6)}to{transform:translate(-50%,-50%) scale(1)}}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.box{background:var(--card);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90%;overflow:auto;display:grid;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .on{background:#5b3fa8;color:#fff}
.ic{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.ic button{font-size:22px;padding:4px}
.warn{background:#fff4d6;color:#5a4300;border-radius:10px;padding:10px;font-size:13px}
canvas{border:1px solid var(--bd);border-radius:10px;background:#fff;touch-action:none;max-width:100%}
.zb{position:absolute;right:10px;bottom:10px;display:grid;gap:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;display:none;z-index:20}
</style></head><body>
<header id="hd" hidden>
<button data-a="home">←</button><h1><span id="ttl"></span> <small style="color:var(--mut)">code: <b id="code"></b></small></h1>
<input id="nm" placeholder="Your name" aria-label="Your name">
<input id="sr" placeholder="Search…" aria-label="Search">
<button data-a="vis">🖼 Visuals</button><button data-a="syn">Summary</button><button data-a="csv">CSV</button><button data-a="pdf">PDF</button><button data-a="share">🔗 Link</button><button data-a="org" id="org" hidden>Rearrange</button>
</header>
<div id="app"></div><div id="md"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ===== Local browser storage: replaces any external service =====
(()=>{
const K="mm_docs_v1",uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return{}}};
let store=load(),seq=0;const subs=new Set(),fire=()=>subs.forEach(f=>f());
const bc=typeof BroadcastChannel!="undefined"?new BroadcastChannel("mm"):null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(store))}catch(e){store=load();throw new Error("Browser storage full: delete some images.")}if(bc)bc.postMessage(1);fire()};
addEventListener("storage",e=>{if(e.key==K){store=load();fire()}});if(bc)bc.onmessage=()=>{store=load();fire()};
const split=p=>{const a=p.split("/");return{coll:a.slice(0,-1).join("/"),id:a[a.length-1]}};
const sd=r=>({id:r?r.id:"",exists:!!r,data:()=>r?r.data:undefined,metadata:{}});
const rows=coll=>Object.keys(store).filter(k=>split(k).coll===coll).sort((a,b)=>store[a].n-store[b].n).map(k=>({id:split(k).id,data:store[k].d}));
const watch=(f,next)=>{const run=()=>next(f());subs.add(run);setTimeout(run,0);return()=>subs.delete(run)};
const Query=(coll,ord,lim)=>{const f=()=>{let r=rows(coll);if(ord){const k=ord.f,m=ord.d=="desc"?-1:1;r=[...r].sort((a,b)=>((a.data[k]>b.data[k])-(a.data[k]<b.data[k]))*m)}
 if(lim)r=r.slice(0,lim);return{docs:r.map(sd),size:r.length,empty:!r.length,metadata:{}}};
 const q={orderBy:(x,d)=>Query(coll,{f:x,d},lim),limit:n=>Query(coll,ord,n),where:()=>q,get:async()=>f(),onSnapshot:(n)=>watch(f,n)};return q};
const DocRef=p=>{const{id}=split(p),g=()=>sd(store[p]?{id,data:store[p].d}:null);return{id,path:p,get:async()=>g(),
 set:async d=>{store[p]={d,n:store[p]?store[p].n:Date.now()*1000+(seq++%1000)};save()},
 update:async d=>{if(store[p]){store[p].d={...store[p].d,...d};save()}},
 delete:async()=>{delete store[p];save()},onSnapshot:n=>watch(g,n)}};
const db={doc:DocRef,collection:c=>({...Query(c),path:c,doc:id=>DocRef(c+"/"+(id||uid())),add:async d=>{const r=DocRef(c+"/"+uid());await r.set(d);return r}})};
let myId=localStorage.getItem("mm_uid");if(!myId){myId=uid();localStorage.setItem("mm_uid",myId)}
const user={me:async()=>({id:myId,name:"",isOwner:false,canEdit:true})};
const assets={async upload(blob){const bm=await createImageBitmap(blob),s=Math.min(1,800/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
 c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);
 return{id:uid(),url:c.toDataURL("image/jpeg",.8)}}};
// Automatic download: PC, Mac, iPad, Android tablets
const downloads={async save({filename,data}){
 const b=data instanceof Blob?data:new Blob([data]);
 const url=URL.createObjectURL(b);
 // Old browsers without the "download" attribute (old iOS Safari): open the file
 if(!("download" in HTMLAnchorElement.prototype)){
  const w=window.open(url,"_blank");
  if(!w)location.href=url;
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return;
 }
 const a=document.createElement("a");
 a.href=url;a.download=filename;a.rel="noopener";a.style.display="none";
 document.body.appendChild(a);
 a.click();
 // long delay: Safari on iPad/iPhone can take time to read the blob
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);
}};
window.claude={use:async n=>({db,user,assets,downloads}[n]||null)};
})();

const Q=[{t:"What works well?",c:"#e3f6e6",b:"#2e7d46",x:-380,y:-30,d:[-1,0]},
{t:"What works less well?",c:"#fde4ee",b:"#c2306b",x:380,y:-30,d:[1,0]},
{t:"What would we need to observe / document to find out?",c:"#e0ecfd",b:"#2563b8",x:0,y:240,d:[0,1]}];
const ICONS="👍 ✅ 💡 ⭐ 🎯 🤝 💬 📅 ⏱️ ⚠️ ❌ 🔍 📊 📝 📚 👥 🧩 🔧 📈 📉 ❓ 🗂️ 📞 🏥 🏫 🏢 🚀 🔄 🔒 📌 🧠".split(" ");
// Image generation service: plug in here (URL of a server function accepting {prompt} and returning {url} or {b64}).
const IMAGE_SERVICE=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let db,user,assets,dl,me,sid=null,sess=null,ideas=[],unsubs=[],V={x:0,y:0,z:1},showVis=true,q="",coll={},drag=null,P={},name=LS.g("nm")||"";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2800)};
const isAnim=()=>sess&&me&&sess.owner===me.id;
const canMod=i=>isAnim()||(me&&i.uid===me.id);
const fmt=t=>new Date(t).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"});
const close=()=>$("#md").innerHTML="";
const modal=h=>{$("#md").innerHTML='<div class="ov"><div class="box">'+h+'</div></div>';$(".ov").onclick=e=>{if(e.target.classList.contains("ov"))close()}};
const col=()=>db.collection("sessions/"+sid+"/ideas");
const upd=(id,d)=>col().doc(id).update(d).catch(e=>toast("Action denied: "+(e.message||e.code)));

async function init(){
 const c=window.claude;
 [db,user,assets,dl]=c?await Promise.all(["db","user","assets","downloads"].map(n=>c.use(n))):[];
 if(!db||!user){$("#app").innerHTML='<div class="home"><div class="card"><h2>Sign-in required</h2><p>This app needs a signed-in account and shared storage to work. Open it from claude.ai.</p></div></div>';return}
 me=await user.me();if(!name)name=me.name||"";
 addEventListener("hashchange",route);route();
}
function route(){const h=location.hash.slice(1);h?open(h):home()}
async function home(){
 unsubs.forEach(u=>u());unsubs=[];sid=null;sess=null;$("#hd").hidden=true;
 $("#app").innerHTML=`<div class="home"><div class="card"><h2>New mind map</h2>
 <input id="hn" placeholder="Session name"><input id="ht" placeholder="Central theme, e.g. Improve our professional practices">
 <button class="p" data-a="create">Create session</button></div>
 <div class="card"><h2>Join a session</h2><input id="hc" placeholder="Session code"><button data-a="join">Join</button></div>
 <div class="card"><h2>Previous sessions</h2><div id="hl">Loading…</div></div></div>`;
 try{const s=await db.collection("sessions").orderBy("ts","desc").limit(20).get();
 $("#hl").innerHTML=s.docs.length?s.docs.map(d=>`<button data-a="go" data-id="${d.id}" style="margin:3px">${esc(d.data().name||d.id)}</button>`).join(""):"No sessions yet.";}catch(e){$("#hl").textContent="List unavailable."}
}
async function create(){
 const t=$("#ht").value.trim(),n=$("#hn").value.trim()||t;if(!t)return toast("Please enter a theme.");
 const id=Math.random().toString(36).slice(2,8);
 try{await db.doc("sessions/"+id).set({name:n,theme:t,owner:me.id,ts:Date.now()});go(id)}catch(e){toast("Could not create: "+(e.message||e.code))}
}
function go(id){try{location.hash=id}catch(e){}open(id)}
function open(id){
 unsubs.forEach(u=>u());sid=id;sess=null;ideas=[];coll={};
 $("#app").innerHTML='<div id="st"><div id="w"></div><div class="zb"><button data-a="zi">＋</button><button data-a="zo">－</button></div></div>';
 $("#hd").hidden=false;$("#nm").value=name;
 const st=$("#st");V.z=Math.min(1,st.clientWidth/1150);V.x=st.clientWidth/2;V.y=st.clientHeight/2-40;
 bind(st);
 unsubs.push(db.doc("sessions/"+id).onSnapshot(s=>{if(!s.exists){$("#app").innerHTML='<div class="home"><div class="card">Session not found.</div></div>';return}sess=s.data();$("#ttl").textContent=sess.name;$("#code").textContent=id;$("#org").hidden=!isAnim();render()},e=>toast(e.message)));
 unsubs.push(col().onSnapshot(s=>{ideas=s.docs.map(d=>({id:d.id,...d.data()}));if(!drag)render()},e=>toast(e.message)));
}
const hh=i=>64+(showVis&&i.img?88:0);
function render(){
 const w=$("#w");if(!w||!sess)return;
 P={};const by=[[],[],[]];ideas.forEach(i=>by[i.q]&&by[i.q].push(i));
 Q.forEach((qq,qi)=>{if(coll[qi])return;const v=qi==2,L=by[qi].sort((a,b)=>a.ts-b.ts),ids=new Set(L.map(i=>i.id)),kids=i=>L.filter(k=>k.p===i.id),roots=L.filter(i=>!i.p||!ids.has(i.p));
  const cs=i=>v?240:hh(i)+16,S=i=>Math.max(cs(i),kids(i).reduce((a,k)=>a+S(k),0));
  const put=(i,a,dp)=>{const s=S(i),c=a+s/2;P[i.id]={x:i.x??(v?c:qq.x+qq.d[0]*(320+dp*270)),y:i.y??(v?qq.y+130+dp*170:c),h:hh(i)};
   const ks=kids(i);let t=a+(s-ks.reduce((x,k)=>x+S(k),0))/2;ks.forEach(k=>{put(k,t,dp+1);t+=S(k)})};
  let a=(v?qq.x:qq.y)-roots.reduce((x,i)=>x+S(i),0)/2;roots.forEach(i=>{put(i,a,0);a+=S(i)})});
 if(drag&&P[drag.id]){P[drag.id].x=drag.x;P[drag.id].y=drag.y}
 const ln=(a,b,k,v)=>{const c=v?[a.x,(a.y+b.y)/2,b.x,(a.y+b.y)/2]:[(a.x+b.x)/2,a.y,(a.x+b.x)/2,b.y];return `<path d="M${a.x} ${a.y}C${c[0]} ${c[1]},${c[2]} ${c[3]},${b.x} ${b.y}" fill="none" stroke="${k}" stroke-width="2" opacity=".7"/>`};
 let s='<svg style="position:absolute;left:0;top:0;overflow:visible" width="1" height="1">';
 Q.forEach((qq,qi)=>{s+=ln({x:0,y:0},qq,qq.b,qi==2);by[qi].forEach(i=>{if(P[i.id])s+=ln(i.p&&P[i.p]?P[i.p]:qq,P[i.id],qq.b,qi==2)})});s+="</svg>";
 s+=`<div class="n ct" style="left:0;top:0">${esc(sess.theme)}${isAnim()?' <button data-a="th" style="background:#fff8;border:0;border-radius:8px">✎</button>':""}</div>`;
 Q.forEach((qq,qi)=>{s+=`<div class="n qn" style="left:${qq.x}px;top:${qq.y}px;--c:${qq.c};--b:${qq.b}">${qq.t}<div style="margin-top:6px"><span>(${by[qi].length})</span> <button data-a="add" data-q="${qi}">+ Add an idea</button> <button data-a="tog" data-q="${qi}" title="Collapse / expand">${coll[qi]?"▸":"▾"}</button></div></div>`});
 ideas.forEach(i=>{const p=P[i.id];if(!p)return;const hit=q&&!i.text.toLowerCase().includes(q);
  s+=`<div class="n i${hit?" dim":""}${Date.now()-i.ts<60000?" new":""}" data-id="${i.id}" style="left:${p.x}px;top:${p.y}px;width:220px;min-height:${p.h}px;--c:${Q[i.q].c};--b:${Q[i.q].b}">
  <div class="t" title="${esc(i.text)}">${i.icon?`<span style="font-size:20px">${i.icon}</span> `:""}${esc(i.text)}</div>
  <div class="m">${esc(i.author||"Anonymous")} · ${fmt(i.ts)}</div>
  ${showVis&&i.img?`<img src="${esc(i.img)}" alt="" data-a="zoom" data-u="${esc(i.img)}">`:""}
  <div class="a"><button data-a="sub" data-id="${i.id}">+ Sub-idea</button><button data-a="pic" data-id="${i.id}" title="Add a visual">🖼</button>${canMod(i)?`<button data-a="edit" data-id="${i.id}">✎</button><button data-a="del" data-id="${i.id}">🗑</button>`:""}</div></div>`});
 w.innerHTML=s;tf();
}
function tf(){$("#w").style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`}
function bind(st){
 st.onpointerdown=e=>{if(e.target.closest("button,input,img"))return;
  const n=e.target.closest(".i"),sx=e.clientX,sy=e.clientY;let mv=false;
  const p0=n?{...P[n.dataset.id]}:null,v0={x:V.x,y:V.y};
  const m=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)mv=true;if(!mv)return;
   if(n){drag={id:n.dataset.id,x:p0.x+dx/V.z,y:p0.y+dy/V.z};render()}else{V.x=v0.x+dx;V.y=v0.y+dy;tf()}};
  const u=()=>{removeEventListener("pointermove",m);removeEventListener("pointerup",u);
   if(drag){const d=drag;drag=null;upd(d.id,{x:Math.round(d.x),y:Math.round(d.y)});render()}};
  addEventListener("pointermove",m);addEventListener("pointerup",u)};
 st.onwheel=e=>{e.preventDefault();const r=st.getBoundingClientRect(),f=e.deltaY<0?1.1:.9,px=e.clientX-r.left,py=e.clientY-r.top;
  V.x=px-(px-V.x)*f;V.y=py-(py-V.y)*f;V.z=Math.max(.2,Math.min(2.5,V.z*f));tf()};
}
function zoom(f){const st=$("#st"),px=st.clientWidth/2,py=st.clientHeight/2;V.x=px-(px-V.x)*f;V.y=py-(py-V.y)*f;V.z=Math.max(.2,Math.min(2.5,V.z*f));tf()}
function ideaForm(qi,i,p){
 modal(`<h2 style="margin:0">${i?"Edit idea":p?"New sub-idea":"New idea"}</h2><small>${Q[qi].t}</small>
 ${name?"":'<input id="fn" placeholder="Your name or nickname">'}
 <textarea id="ft" rows="3" placeholder="Your idea">${esc(i?i.text:"")}</textarea>
 <div><button class="p" id="ok">Save</button> <button onclick="close()">Cancel</button></div>`);
 $("#ok").onclick=async()=>{const t=$("#ft").value.trim();if(!t)return;
  if($("#fn")){name=$("#fn").value.trim()||"Anonymous";LS.s("nm",name);$("#nm").value=name}
  try{if(i)await col().doc(i.id).update({text:t});else await col().add({q:qi,p:p||null,text:t,author:name||"Anonymous",uid:me.id,ts:Date.now()});close()}catch(e){toast("Denied: "+(e.message||e.code))}}
}
async function up(blob,id){if(!assets)return toast("Upload reserved for page editors.");
 try{const r=await assets.upload(blob);await upd(id,{img:r.url});close()}catch(e){toast("Upload failed: "+(e.message||e.code))}}
function picker(id,tab="up"){
 const i=ideas.find(x=>x.id===id);if(!i)return;
 const T={up:"Upload",ic:"Icon",ai:"AI",dr:"Drawing"};
 let b="";
 if(tab=="up")b=assets?'<input type="file" id="fi" accept="image/*"><img id="pv" alt="" style="max-width:100%;display:none;border-radius:10px"><button class="p" id="ok" disabled>Confirm</button>':'<div class="warn">Image upload is reserved for people who can edit this page. Icons are still available.</div>';
 if(tab=="ic")b='<div class="ic">'+ICONS.map(c=>`<button data-ic="${c}">${c}</button>`).join("")+"</div>";
 if(tab=="ai")b=`<textarea id="pr" rows="3">${esc("Simple, clear illustration: "+i.text)}</textarea>
  ${IMAGE_SERVICE?'<button class="p" id="gen">Generate</button><img id="pv" alt="" style="max-width:100%;display:none"><button id="ok" style="display:none">Keep</button>':'<div class="warn"><b>AI generation not configured.</b> This feature requires connecting an image generation service via API (<code>IMAGE_SERVICE</code> constant in the code). No image is simulated.</div>'}`;
 if(tab=="dr")b=assets?'<canvas id="cv" width="320" height="220"></canvas><div><button data-c="#1f2430">⚫</button><button data-c="#2e7d46">🟢</button><button data-c="#c2306b">🔴</button><button data-c="#2563b8">🔵</button> <button id="clr">Clear</button> <button class="p" id="ok">Confirm</button></div>':'<div class="warn">Drawing requires image storage, reserved for page editors.</div>';
 modal(`<h2 style="margin:0">Add a visual</h2><small>${esc(i.text)}</small>
 <div class="tabs">${Object.entries(T).map(([k,v])=>`<button data-t="${k}" class="${k==tab?"on":""}">${v}</button>`).join("")}</div>${b}
 ${i.img||i.icon?'<button id="rm">Remove current visual</button>':""}`);
 $("#md").querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>picker(id,x.dataset.t));
 $("#md").querySelectorAll("[data-ic]").forEach(x=>x.onclick=async()=>{await upd(id,{icon:x.dataset.ic});close()});
 if($("#rm"))$("#rm").onclick=async()=>{await upd(id,{img:null,icon:null});close()};
 if(tab=="up"&&assets){let f;$("#fi").onchange=e=>{f=e.target.files[0];if(!f)return;$("#pv").src=URL.createObjectURL(f);$("#pv").style.display="block";$("#ok").disabled=false};$("#ok").onclick=()=>up(f,id)}

  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};

function ordered(qi){const all=ideas.filter(i=>i.q==qi).sort((a,b)=>a.ts-b.ts),ids=new Set(all.map(i=>i.id)),L=[],walk=(i,d)=>{L.push({...i,d});all.filter(k=>k.p===i.id).forEach(k=>walk(k,d+1))};all.filter(i=>!i.p||!ids.has(i.p)).forEach(i=>walk(i,0));return L}
function mkpdf(){const J=window.jspdf;if(!J)return null;const d=new J.jsPDF(),cl=s=>String(s??"").replace(/[^\u0000-\u00ff\u2018\u2019\u2013\u2014]/g,""),W=175;let y=20;
 const chk=n=>{if(y+n>285){d.addPage();y=20}};
 d.setFontSize(18);d.setTextColor(31,36,48);d.text(cl(sess.name),15,y);y+=9;d.setFontSize(11);
 d.splitTextToSize("Theme: "+cl(sess.theme),W).forEach(l=>{d.text(l,15,y);y+=6});y+=4;
 Q.forEach((qq,qi)=>{const L=ordered(qi),c=[1,3,5].map(k=>parseInt(qq.b.slice(k,k+2),16));chk(20);d.setFontSize(13);d.setTextColor(...c);
  d.splitTextToSize(cl(qq.t)+" ("+L.length+")",W).forEach(l=>{d.text(l,15,y);y+=7});d.setFontSize(10.5);d.setTextColor(31,36,48);
  if(!L.length){d.text("No ideas.",20,y);y+=7}
  L.forEach(i=>{const x=20+i.d*8;d.splitTextToSize("- "+cl(i.text)+" ("+cl(i.author)+")",W-5-i.d*8).forEach(l=>{chk(6);d.text(l,x,y);y+=5.5})});y+=6});
 return d}
function synth(){
 modal('<h2 style="margin:0">Summary</h2>'+Q.map((qq,qi)=>{const L=ordered(qi);

async function csv(){

 if(!dl)return downloads_fallback(new Blob([s],{type:"text/csv;charset=utf-8"}),"proposals.csv");

// "Mind map" PDF: draws the diagram (nodes + curves) on a landscape A3 page
function mkmap(){const J=window.jspdf;if(!J)return null;
 // positions: expand everything during the calculation, then restore the display
 const sc=coll;coll={};render();const LP={};Object.keys(P).forEach(k=>LP[k]={...P[k]});coll=sc;render();
 const cl=s=>String(s??"").replace(/[^\u0000-\u00ff\u2018\u2019\u2013\u2014]/g,""),rgb=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));
 const C={x:0,y:0,w:230,h:56},QN=Q.map(q=>({x:q.x,y:q.y,w:250,h:70})),IW=220;
 const list=ideas.filter(i=>LP[i.id]),IN={};list.forEach(i=>IN[i.id]={x:LP[i.id].x,y:LP[i.id].y,w:IW,h:LP[i.id].h});
 const all=[C,...QN,...Object.values(IN)];
 const x0=Math.min(...all.map(n=>n.x-n.w/2)),x1=Math.max(...all.map(n=>n.x+n.w/2)),y0=Math.min(...all.map(n=>n.y-n.h/2)),y1=Math.max(...all.map(n=>n.y+n.h/2));
 const PW=420,PH=297,M=10,T=24,s=Math.min(.5,(PW-2*M)/(x1-x0),(PH-T-M)/(y1-y0));
 const ox=(PW-(x1-x0)*s)/2,oy=T+(PH-T-M-(y1-y0)*s)/2,X=x=>ox+(x-x0)*s,Y=y=>oy+(y-y0)*s;
 const d=new J.jsPDF({orientation:"landscape",format:"a3"});
 d.setFont("helvetica","bold");d.setFontSize(16);d.setTextColor(31,36,48);d.text(cl(sess.name),M,M+6);
 d.setFont("helvetica","normal");d.setFontSize(10);d.text("Theme: "+cl(sess.theme),M,M+13);
 const ln=(a,b,k,v)=>{const c=v?[a.x,(a.y+b.y)/2,b.x,(a.y+b.y)/2]:[(a.x+b.x)/2,a.y,(a.x+b.x)/2,b.y],sx=X(a.x),sy=Y(a.y);
  d.setDrawColor(...rgb(k));d.setLineWidth(Math.max(.35,2*s));d.lines([[X(c[0])-sx,Y(c[1])-sy,X(c[2])-sx,Y(c[3])-sy,X(b.x)-sx,Y(b.y)-sy]],sx,sy,[1,1],"S")};
 Q.forEach((qq,qi)=>{ln(C,QN[qi],qq.b,qi==2)});
 list.forEach(i=>{const q=Q[i.q];ln(IN[i.p]||QN[i.q],IN[i.id],q.b,i.q==2)});
 const box=(n,f,b,lw,r)=>{d.setFillColor(...rgb(f));d.setDrawColor(...rgb(b));d.setLineWidth(lw);d.roundedRect(X(n.x-n.w/2),Y(n.y-n.h/2),n.w*s,n.h*s,r*s,r*s,"FD")};
 const mid=(t,n,fs,bold)=>{d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(fs*s*2.835);d.setTextColor(31,36,48);
  const L=d.splitTextToSize(cl(t),(n.w-24)*s),lh=fs*1.25*s,h=L.length*lh;L.forEach((l,k)=>d.text(l,X(n.x),Y(n.y)-h/2+lh*(k+.8),{align:"center"}))};
 box(C,"#ece6fb","#5b3fa8",Math.max(.5,2.5*s),40);mid(sess.theme,C,17,true);
 Q.forEach((qq,qi)=>{box(QN[qi],qq.c,qq.b,Math.max(.4,1.5*s),26);mid(qq.t+" ("+ideas.filter(i=>i.q==qi).length+")",QN[qi],15,true)});
 list.forEach(i=>{const q=Q[i.q],n=IN[i.id],L=n.x-n.w/2+12,tp=n.y-n.h/2;
  box(n,q.c,q.b,Math.max(.4,1.5*s),22);
  d.setFont("helvetica","normal");d.setFontSize(14*s*2.835);d.setTextColor(31,36,48);
  let ls=d.splitTextToSize(cl(i.text),(n.w-24)*s);if(ls.length>2){ls=ls.slice(0,2);ls[1]=ls[1].replace(/.{0,2}$/,"")+"..."}
  ls.forEach((l,k)=>d.text(l,X(L),Y(tp+10+14*.8+k*17.5)));
  d.setFontSize(11*s*2.835);d.setTextColor(74,80,100);d.text(cl(i.author||"Anonymous"),X(L),Y(tp+10+ls.length*17.5+11));
  if(showVis&&i.img){try{d.addImage(i.img,"JPEG",X(L),Y(n.y+n.h/2-8-80),(n.w-24)*s,80*s)}catch(e){}}});
 return d}
function exportPdf(k){close();
 const d=k=="m"?mkmap():mkpdf();
 if(!d)return toast("PDF module unavailable (check your connection).");
 const blob=d.output("blob"),fn=k=="m"?"mind-map-diagram.pdf":"mind-map-text.pdf";
 (dl?dl.save({filename:fn,data:blob}):downloads_fallback(blob,fn))
  .then(()=>toast("PDF downloaded"))
  .catch(e=>{if(e&&e.code!="declined")toast("Export failed.")});
}
// Fallback if the download service is unavailable
async function downloads_fallback(blob,fn){
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=fn;a.style.display="none";
 document.body.appendChild(a);a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000);
}
